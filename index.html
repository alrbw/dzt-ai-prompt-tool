<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Manager</title>
<style>
    :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 20px; margin: 0; min-height: 100vh; box-sizing: border-box; }
    
    /* --- LOGIN OVERLAY STYLES --- */
    #login-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #111827; /* Màu nền tối */
        z-index: 9999;
        display: flex; justify-content: center; align-items: center; flex-direction: column;
        transition: opacity 0.5s ease;
    }
    .login-box {
        background: white; padding: 30px; border-radius: 12px; text-align: center; width: 300px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .login-box h3 { margin-top: 0; color: #333; }
    .login-box input {
        width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px;
        box-sizing: border-box; font-size: 16px; text-align: center;
    }
    .login-box button {
        width: 100%; padding: 12px; background: var(--primary); color: white; border: none;
        border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;
    }
    .login-box button:hover { background: #1d4ed8; }
    .hint { font-size: 12px; color: #666; margin-top: 10px; font-style: italic; }

    /* --- MAIN APP STYLES --- */
    .container { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 650px; max-width: 100%; opacity: 0; transition: opacity 1s; }
    h2 { text-align: center; margin-top: 0; margin-bottom: 24px; font-weight: 800; color: #111; letter-spacing: -0.5px; }
    .control-group { margin-bottom: 15px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 13px; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; }
    select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: #fff; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; box-sizing: border-box; transition: border-color 0.2s;}
    select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .dashboard-row { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-start; background: #f9fafb; padding: 15px; border-radius: 12px; border: 1px solid #e5e7eb; }
    #image-preview { width: 150px; height: 150px; flex-shrink: 0; border-radius: 8px; overflow: hidden; border: 1px solid #d1d5db; background-color: #fff; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    #image-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .controls-right { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; min-height: 150px; }
    .box { margin-bottom: 20px; position: relative; animation: slideDown 0.3s ease-out; }
    .box-label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; resize: vertical; font-family: 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 13px; box-sizing: border-box; background-color: #fff; line-height: 1.5; color: #374151; transition: border 0.2s; }
    textarea:focus { background: #fff; border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    .copy-btn { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; position: absolute; bottom: 10px; right: 10px; opacity: 0.9; }
    .copy-btn:hover { opacity: 1; transform: translateY(-1px); }
    .hidden { display: none; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h3>🔒 Security Check</h3>
        <p style="font-size: 14px; color: #555;">New device detected.</p>
        <input type="password" id="passInput" placeholder="Enter Dynamic Passcode">
        <button onclick="checkPass()">Unlock</button>
        <p class="hint">Hint: Base code + Today's date (DD)</p>
    </div>
</div>

<div class="container" id="mainApp">
    <h2>AI Prompt Manager</h2>

    <div class="control-group">
        <label for="typeSelect">SELECT TOOL TYPE</label>
        <select id="typeSelect" onchange="onTypeChange()">
            <option value="comfy">ComfyUI</option>
            <option value="gemini">Gemini</option>
        </select>
    </div>

    <div class="dashboard-row">
        <div id="image-preview">
            <img id="img-tag" src="" alt="Style Preview">
        </div>
        <div class="controls-right">
            <div class="control-group">
                <label for="styleSelect">CHOOSE STYLE</label>
                <select id="styleSelect" onchange="onStyleChange()"></select>
            </div>
            <div class="control-group hidden" id="colorGroup">
                <label for="colorSelect">SELECT COLOR VARIATION</label>
                <select id="colorSelect" onchange="renderContent()"></select>
            </div>
        </div>
    </div>

    <div id="contentArea"></div>
</div>

<script>
    // --- PHẦN CẤU HÌNH MẬT KHẨU ---
    const BASE_PASS = "dztma@"; // <--- Đổi mật khẩu gốc của bạn ở đây
    // -----------------------------

    // LOGIC KIỂM TRA MẬT KHẨU
    function checkPass() {
        const input = document.getElementById('passInput').value;
        const overlay = document.getElementById('login-overlay');
        const app = document.getElementById('mainApp');
        
        // Tạo mật khẩu động: Pass gốc + Ngày hiện tại (Ví dụ: Macorner16)
        const today = new Date();
        const dateStr = String(today.getDate()).padStart(2, '0'); // Lấy ngày, ví dụ "16"
        const correctPass = BASE_PASS + dateStr; 

        // Logic Backdoor (cho trường hợp khẩn cấp): nhập đúng BASE_PASS vẫn cho vào
        if (input === correctPass || input === BASE_PASS) {
            // Lưu trạng thái đã đăng nhập vào bộ nhớ trình duyệt
            localStorage.setItem('promptTool_auth', 'true');
            
            // Hiệu ứng mở khóa
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            app.style.opacity = '1';
        } else {
            alert("Wrong Password!");
            document.getElementById('passInput').value = "";
        }
    }

    // Tự động kiểm tra khi tải trang
    window.onload = function() {
        const isAuth = localStorage.getItem('promptTool_auth');
        const overlay = document.getElementById('login-overlay');
        const app = document.getElementById('mainApp');

        if (isAuth === 'true') {
            overlay.style.display = 'none';
            app.style.opacity = '1';
            // Vẫn chạy logic khởi tạo tool
            onTypeChange();
        } else {
            // Chưa đăng nhập thì hiện overlay, ẩn app
            overlay.style.display = 'flex';
            onTypeChange(); // Load ngầm dữ liệu
        }
    };
    
    // Xử lý nút Enter khi nhập pass
    document.getElementById("passInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") checkPass();
    });

    // --- DỮ LIỆU CÔNG CỤ (GIỮ NGUYÊN NHƯ CŨ) ---
    const DB = {
        "comfy": {
            defaultLabels: ["Prompt", "Custom Prompt", "String_c"],
            styles: {
                "caricature": {
                    name: "Caricature",
                    image: "https://macorner.co/cdn/shop/files/Caricature-Wall-Art-For-Funny-Couples-Custom-Cartoon-Drawing-From-Photo-Personalized-Photo-Poster_1_c48fb5cb-c841-4c70-9cf0-00b953e0ead1.jpg?v=1758352173&width=1946", 
                    data: { t1: "convert this image to caricature style, amplify prominent features." }
                },
                "timburton": {
                    name: "Tim Burton",
                    image: "https://macorner.co/cdn/shop/files/Family-Halloween-Style-Portrait--Personalized-Poster_4.jpg?v=1758362126&width=1946",
                    data: { t1: "Transform the photo into a dark gothic illustration in Tim Burton style. Keep same people, clothes, and poses. Add large dark eyes, pale skin, eerie night background with full moon and trees. Muted colors, spooky mood." }
                },
                "vangogh": {
                    name: "Van Gogh",
                    image: "https://macorner.co/cdn/shop/files/Van-Gogh-Wall-Art-You-_-Me-We-Got-This-Personalized-Photo-Poster_1_e0ae8bb2-1f04-4565-9669-463d04c142e1.jpg?v=1758362760&width=1946",
                    data: {
                        t1: "Convert this image to v4ngogh style, thick oil brush strokes with rough and aged impasto oil texture. Each stroke of oil paint is three-dimensional, uneven, layered and tactile. Uneven brushstrokes clearly visible on skin, clothing, and background. The surface shows dense ridges of pigment catching the light, giving a sculpted appearance, rough aged oil depth, and strong texture realism. Evoking the energy of a real hand-painted masterpiece.",
                        t2: "Visible old canvas fibers, matte finish, slightly weathered pigment, dry brush texture, and tactile paint ridges catching soft light."
                    }
                },
                "toile": {
                    name: "Toile-Sketch (Multi-Color)",
                    image: "https://macorner.co/cdn/shop/files/Custom-Photo-Ring-Dish-Gift-For-Friends-Soul-Sisters-Personalized-Photo-Jewelry-Dish_1.jpg?v=1765960906&width=1946",
                    isMultiColor: true,
                    colors: {
                        "Blue": { t1: "Transform the photo into a hand-drawn Toile de Jouy–style line illustration from the photo in cobalt-blue ink (#243E94). Transform people in the photo on a pure white background. Use clean, confident contour pencil-like lines for structure, never bold.\nCreate depth and softness using gentle, directional strokes that follow the form of the body, hair, and fabric. Apply minimal line-based shading to blend cropped edges. Never use flat fills, solid blocks, or digital paint. Change all colors to blue ink. Remove all the background.", t2: "Remove the photo's background completely\nReplace with a solid white background\nLine weight is color #243E94\nBlue ink color only" },
                        "Green": { t1: "Transform the photo into a hand-drawn Toile de Jouy–style line illustration from the photo in green ink (#38723A). Transform people in the photo on a pure white background. Use clean, confident contour pencil-like lines for structure, never bold.\nCreate depth and softness using gentle, directional strokes that follow the form of the body, hair, and fabric. Apply minimal line-based shading to blend cropped edges. Never use flat fills, solid blocks, or digital paint. Change all colors to green ink. Remove all the background.", t2: "Remove the photo's background completely\nReplace with a solid white background\nLine weight is color #38723A\nGreen ink color only" },
                        "Purple": { t1: "Transform the photo into a hand-drawn Toile de Jouy–style line illustration from the photo in purple ink (#774780). Transform people in the photo on a pure white background. Use clean, confident contour pencil-like lines for structure, never bold.\nCreate depth and softness using gentle, directional strokes that follow the form of the body, hair, and fabric. Apply minimal line-based shading to blend cropped edges. Never use flat fills, solid blocks, or digital paint. Change all colors to purple ink. Remove all the background.", t2: "Remove the photo's background completely\nReplace with a solid white background\nLine weight is color #774780\nPurple ink color only" },
                        "Pink": { t1: "Transform the photo into a hand-drawn Toile de Jouy–style line illustration from the photo in rose pink ink (#db77a9). Transform people in the photo on a pure white background. Use clean, confident contour pencil-like lines for structure, never bold.\nCreate depth and softness using gentle, directional strokes that follow the form of the body, hair, and fabric. Apply minimal line-based shading to blend cropped edges. Never use flat fills, solid blocks, or digital paint. Change all colors to pink ink. Remove all the background.", t2: "Remove the photo's background completely\nReplace with a solid white background\nLine weight is color #db77a9\npink ink color only" },
                        "Red": { t1: "Transform the photo into a hand-drawn Toile de Jouy–style line illustration from the photo in deep red ink (#A22129). Transform people in the photo on a pure white background. Use clean, confident contour pencil-like lines for structure, never bold.\nCreate depth and softness using gentle, directional strokes that follow the form of the body, hair, and fabric. Apply minimal line-based shading to blend cropped edges. Never use flat fills, solid blocks, or digital paint. Change all colors to red ink. Remove all the background.", t2: "Remove the photo's background completely\nReplace with a solid white background\nLine weight is color #A22129\nRed ink color only" },
                        "Black": { t1: "Transform the photo into a hand-drawn Toile de Jouy–style line illustration from the photo in black ink (#000000). Transform people in the photo on a pure white background. Use clean, confident contour pencil-like lines for structure, never bold.\nCreate depth and softness using gentle, directional strokes that follow the form of the body, hair, and fabric. Apply minimal line-based shading to blend cropped edges. Never use flat fills, solid blocks, or digital paint. Change all colors to black ink. Remove all the background.", t2: "Remove the photo's background completely\nReplace with a solid white background\nLine weight is color #000000\nBlack ink color only" }
                    }
                }
            }
        },
        "gemini": {
            defaultLabels: ["Prompt 1", "Prompt 2", "Prompt 3"],
            styles: {
                "pet_silky": {
                    name: "Pet Silky Fur",
                    image: "https://macorner.co/cdn/shop/files/Pet-Portrait-Floral-Gift-For-Pet-Lovers-Loss-Of-Pet-Personalized-Photo-Poster-2_fb9cdafb-681f-4b8f-a5e1-3f9dd25207b4.jpg?v=1767109961&width=1946",
                    customLabels: { t1: "Prompt 1: BASE", t2: "Prompt 2: EDIT", t3: "Prompt 3: CONSTRAINTS" },
                    data: {
                        t1: "Use this image as the base. Preserve the pet’s exact face shape, head angle, proportions, eye shape/placement, snout structure, ear shape, and all fur colors, markings, and spot shapes exactly as in the original. No changes to anatomy, color pattern, or fur regions.",
                        t2: "Render the pet in a high-contrast, ultra-realistic glossy oil-paint style with smooth, silky, detailed fur and natural depth. Enhance brightness and fine detail around the head, eyes, and muzzle. Add richer highlights for a pleasing, lustrous, dimensional look. Replace the background with pure white #ffffff.",
                        t3: "Do not alter head shape, proportions, eye spacing, snout length, ear position, or any marking shapes.\nDo not shift fur colors, modify spot locations, or stylize in ways that change likeness.\nNo watercolor, filters, outlines, gradients, or anatomy changes.\nFinal result must remain a faithful likeness with improved realism, gloss, and depth."
                    }
                },
                "pet_sticker": {
                    name: "Pet Face Draw",
                    image: "https://macorner.co/cdn/shop/files/Custom-Pet-Portrait-Mug-Dog-Mug-Cat-Mug-New-Version-Personalized-Photo-Mug_1_0877d3c6-3a4c-4f9e-9424-ba53df9994d2.jpg?v=1766494621&width=1946",
                    data: {
                        t1: "Transform the uploaded pet photo into a bold, cute hand-drawn head portrait of the pet, focusing only on the face and a small part of the neck. Style: bold, playful hand-drawn line art with a natural wobble — slightly uneven, hand-sketched lines that feel charming and organic. Line weight: thick black lines with slight irregularity; avoid thin, digitally perfect strokes. Details: preserve the pet’s true facial proportions and expression — accurate eyes, nose, mouth, and essential fur shapes. Simplify fur texture into minimal curved contour lines to keep the design cute and readable. Fill: solid black only for the eyes, nose, and mouth; everything else should be line-only with no shading or gradients. Sticker outline: add an uneven white outline stroke (approximately 3–5 mm, allowed to vary naturally) around the head to create a hand-cut sticker feel. Background: place the sticker on a neutral mid-gray background, with the white stroke fully separating the sticker from the gray background. No shadows, no glow, no drop-shadow effects. Output: high-resolution 1:1 ratio, centered composition, clean and crisp lines, bold black-and-white hand-drawn style. Negative prompts: full body, shoulders, background scenery, soft shading, gray tones inside the illustration, fine hair strands, gradient effects, vector-smooth perfection, drop shadows, reflections."
                    }
                },
                "couple_wc": {
                    name: "Couple Watercolor",
                    image: "https://macorner.co/cdn/shop/files/Watercolor-Portrait-Couple-First-Anniversary-Valentines-Day-Personalized-Photo-Poster_1.jpg?v=1766630830&width=1946",
                    data: {
                        t1: "A watercolor illustration combined with expressive line-brush sketching of the entire couple from the reference photo, on a clean pure white background with a very light, soft watercolor wash. Remove the background completely so only the person(s) remain. Preserve true proportions, posture, facial expression, hairstyle, clothing silhouette, and overall likeness. Accurately retain natural skin tone and undertones, visible jewelry, accessories, tattoos, and any distinctive personal details exactly as in the reference. Use clean, confident contour lines for structure, never bold.\nCreate depth and softness using gentle, directional strokes that follow the form of the body, hair, skin, and fabric. Apply subtle watercolor shading and layered washes to build rich mid-tones and realistic color transitions while keeping edges natural and breathable — no flat fills, solid blocks, or digital paint.\nAllow controlled tone buildup for dimensionality without harsh cut-offs, maintaining an airy, painterly balance. Avoid dense cross-hatching, noisy textures, or decorative patterns. The final artwork should feel refined, hyper-real yet painterly, combining expressive line work with deep, luminous watercolor depth."
                    }
                },
                "couple_simple": {
                    name: "Couple Simple Color",
                    image: "https://macorner.co/cdn/shop/files/Custom-Couple-Portrait-Anniversary-Valentines-Day-Gift-For-Her-Him-Personalized-Photo-Poster_1_f1a75db0-1b77-405a-aa82-d15103332a5b.jpg?v=1767061083&width=1946",
                    customLabels: { t1: "Prompt 1: BASE", t2: "Prompt 2: ABSOLUTE CONSTRAINTS" },
                    data: {
                        t1: "A clean, modern flat digital lifestyle illustration of the full figure(s) from the reference photo, using a soft pastel background color sampled and gently softened from the original image. The background must be solid, flat, and minimal, with no textures, gradients, objects, or environmental details.\nPreserve exact likeness from the source image, including facial features, eye color, skin tone, hairstyle, body proportions, posture, expression, and clothing identity, with no beautification bias or identity drift.\nThe illustration must be line-driven. Use clean, thin, sharp line art as the primary visual language, with extra precision on facial features and hairlines. Eyes, nose, lips, and jawline should be clearly defined by confident lines. Hair must be built with refined directional linework and layered strands, natural flow, no blobby shapes, no fuzzy or painterly edges.\nStrongly limit shading: use only minimal, near-flat tonal accents when absolutely necessary to suggest structure. Avoid smooth gradients, blended shading, airbrush effects, dramatic lighting, or realism-heavy depth. Volume should be implied mainly through line quality and shape clarity.\nColors remain light, muted, and cohesive. Skin appears clean and natural; eyes realistic and proportional; lips understated. No pores, noise, grain, painterly texture, or photographic detail.\nOverall mood: modern, minimal, refined, Instagram-ready flat lifestyle illustration—sharp, elegant, airy, and visually controlled.",
                        t2: "ABSOLUTE CONSTRAINTS:\nNo hyper-realism. No anime, cartoon, chibi, or exaggerated features.\nNo bold or thick outlines. No strong contrast or complex background.\nNo changes to identity (eye color, facial structure, hairstyle, or likeness)."
                    }
                },
                "independence": {
                    name: "Independence Day",
                    image: "https://macorner.co/cdn/shop/files/Vintage-4Th-Of-July-Fine-Art-Oil-Painting-Style-Personalized-Photo-Poster_1.jpg?v=1768211412&width=1946",
                    customLabels: { t1: "Prompt 1: BASE", t2: "Prompt 2: ABSOLUTE CONSTRAINTS" },
                    data: {
                        t1: "A clean, modern flat digital lifestyle illustration of the full figure(s) from the reference photo, using a soft pastel background color sampled and gently softened from the original image. The background must be solid, flat, and minimal, with no textures, gradients, objects, or environmental details.\nPreserve exact likeness from the source image, including facial features, eye color, skin tone, hairstyle, body proportions, posture, expression, and clothing identity, with no beautification bias or identity drift.\nThe illustration must be line-driven. Use clean, thin, sharp line art as the primary visual language, with extra precision on facial features and hairlines. Eyes, nose, lips, and jawline should be clearly defined by confident lines. Hair must be built with refined directional linework and layered strands, natural flow, no blobby shapes, no fuzzy or painterly edges.\nStrongly limit shading: use only minimal, near-flat tonal accents when absolutely necessary to suggest structure. Avoid smooth gradients, blended shading, airbrush effects, dramatic lighting, or realism-heavy depth. Volume should be implied mainly through line quality and shape clarity.\nColors remain light, muted, and cohesive. Skin appears clean and natural; eyes realistic and proportional; lips understated. No pores, noise, grain, painterly texture, or photographic detail.\nOverall mood: modern, minimal, refined, Instagram-ready flat lifestyle illustration—sharp, elegant, airy, and visually controlled.",
                        t2: "ABSOLUTE CONSTRAINTS:\nNo hyper-realism. No anime, cartoon, chibi, or exaggerated features.\nNo bold or thick outlines. No strong contrast or complex background.\nNo changes to identity (eye color, facial structure, hairstyle, or likeness)."
                    }
                }
            }
        }
    };

    const typeSelect = document.getElementById('typeSelect');
    const styleSelect = document.getElementById('styleSelect');
    const colorSelect = document.getElementById('colorSelect');
    const colorGroup = document.getElementById('colorGroup');
    const contentArea = document.getElementById('contentArea');
    const imgTag = document.getElementById('img-tag');
    const imgPreview = document.getElementById('image-preview');

    function onTypeChange() {
        const type = typeSelect.value;
        const styles = DB[type].styles;
        styleSelect.innerHTML = "";
        for (const key in styles) {
            let option = document.createElement('option');
            option.value = key;
            option.textContent = styles[key].name;
            styleSelect.appendChild(option);
        }
        onStyleChange();
    }

    function onStyleChange() {
        const type = typeSelect.value;
        const styleKey = styleSelect.value;
        const styleObj = DB[type].styles[styleKey];

        if (styleObj.image && styleObj.image.length > 5) {
            imgTag.src = styleObj.image;
            imgPreview.style.display = 'block';
        } else {
            imgPreview.style.display = 'none';
        }

        if (styleObj.isMultiColor) {
            colorGroup.classList.remove('hidden');
            colorSelect.innerHTML = "";
            for (const colorKey in styleObj.colors) {
                let op = document.createElement('option');
                op.value = colorKey;
                op.textContent = colorKey;
                colorSelect.appendChild(op);
            }
        } else {
            colorGroup.classList.add('hidden');
        }

        renderContent();
    }

    function renderContent() {
        const type = typeSelect.value;
        const styleKey = styleSelect.value;
        const styleObj = DB[type].styles[styleKey];
        const defaultLabels = DB[type].defaultLabels;

        let dataToRender = {};
        if (styleObj.isMultiColor) {
            const colorKey = colorSelect.value;
            dataToRender = styleObj.colors[colorKey];
        } else {
            dataToRender = styleObj.data;
        }

        contentArea.innerHTML = "";
        const customLabels = styleObj.customLabels || {};

        let index = 0;
        const keys = Object.keys(dataToRender).sort();
        
        keys.forEach((key, i) => {
            const textContent = dataToRender[key];
            if (!textContent) return;

            let labelText = "";
            if (customLabels[key]) {
                labelText = customLabels[key]; 
            } else if (defaultLabels[i]) {
                labelText = defaultLabels[i]; 
            } else {
                labelText = "Content " + (i + 1);
            }

            const boxDiv = document.createElement('div');
            boxDiv.className = 'box';

            boxDiv.innerHTML = `
                <div class="box-label-row">
                    <label>${labelText}</label>
                </div>
                <textarea id="txt_${key}" readonly>${textContent}</textarea>
                <button class="copy-btn" onclick="copyText('txt_${key}', this)">Copy</button>
            `;
            contentArea.appendChild(boxDiv);
        });
    }

    function copyText(id, btn) {
        const el = document.getElementById(id);
        el.select();
        el.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(el.value);
        
        const originalText = btn.textContent;
        btn.textContent = "Copied!";
        btn.style.backgroundColor = "#10b981"; 
        setTimeout(() => { 
            btn.textContent = originalText; 
            btn.style.backgroundColor = ""; 
        }, 1000);
    }

    // Không gọi onTypeChange() ở đây nữa, vì onload sẽ gọi
</script>

</body>
</html>
